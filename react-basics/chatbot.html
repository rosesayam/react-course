<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button{
        background-color: green;
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input{
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }
      .chat-input-container{
        display:flex;
        margin-bottom: 60px;
      }
      .app-container{
        max-width: 600px;
        margin-left:auto ;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-message-user{
        display: flex;
        justify-content: end;
        align-items: start;

      }
      .chat-message-text{
        background-color: rgb(238, 238,238);
       padding: 15px 20px;
       border-radius: 10px;
       margin-right: 10px;
       margin-left: 10px;
       margin-bottom: 20px;
       max-width: 300px;
      }
      .chat-message-robot{
        display: flex;
        align-items: start;
      }
      .chat-message-profile{
        width: 45px;

      }
      .chat-message-container{
        flex-grow: 1;
        margin-top: 20px;
        
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages,setChatMessages}){ 
        const [inputText ,setInputText ] = React.useState('');
        function saveInputText(event){
          setInputText(event.target.value);
        }
        function sendMessages(){
          const newChatMessages=[ 
                ...ChatMessages,
              {
                message : inputText,
                sender: 'user',
                id : crypto.randomUUID()
              }]
          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
           setChatMessages(
            ...newChatMessages,
          {
            message : response,
            sender: 'robot',
            id : crypto.randomUUID()
          });
          setInputText('');
        }
        return (
        <div class="chat-input-container">
           <input placeholder="Type your message..." size="30" onChange={saveInputText} value ={inputText} class="chat-input"/>
           <button onClick={sendMessages} class="send-button">Send</button>
        </div> 
       );}
       function ChatMessage({message, sender}){
        // const {message, sender} = props;
        /*if(sender === "bot"){
          return(
            <div>
               <img src="robot.png" width="50" />
               {message}
            </div>
        );}  */

         return(
          <div class={sender==='user'? 'chat-message-user' : 'chat-message-robot' }>
             {sender ==='bot'&&<img src="robot.png" class="chat-message-profile"/>}
             <div class="chat-message-text">{message}</div>
             {sender ==='user'&&<img src="user.png" class="chat-message-profile" />}

          </div>
         );
       }

       function ChatMessages({chatMessages}){
        return(
         <div class="chat-message-container">
            {chatMessages.map((chatMessage)=>{
                  return(
                    <ChatMessage 
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key ={chatMessage.id}
                    />
                  ) })}
          </div>
               );}

       function App(){
        const [chatMessages,setChatMessages]  =  React.useState([{

          message: 'hello chatbot' ,
          sender : 'user',
          id : 'id1'
        },
        {
          message: 'how are u?' ,
          sender : 'bot',
          id : 'id2'
        },
        {
          message: 'i am fine thank u' ,
          sender : 'user' ,
          id: 'id3'
        },
        {
          message: 'what can i do for u ?' ,
          sender : 'bot' ,
          id :'id4'
        }]);
      // const [chatMessages,setChatMessages]= array ;
      //  const chatMessages =array[0];
      // const setChatMessages =array[1]; 
        return(
           <div class="app-container">
           
           <ChatMessages
           chatMessages={chatMessages}/>
           <ChatInput 
           chatMessages ={chatMessages}
           setChatMessages={setChatMessages}
           />
           </div>
        );
       }
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
